<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일본 여행 일정 플래너 · 비행기 시간 반영</title>
<style>
  :root{
    --sumi:#191E26; --ai:#26456F; --ai-soft:#3E6DA8; --asagi:#7FA9C4;
    --karashi:#C08A2E; --paper:#EDEBE5; --paper-2:#F7F6F2;
    --rule:#D3CFC5; --muted:#6C6A64; --alert:#A8442F; --ok:#3F7A5A;
    --mono: ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic","맑은 고딕",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--sumi);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:880px;margin:0 auto;padding:0 20px 80px}

  .board{background:var(--sumi);color:var(--paper-2);padding:26px 20px 22px;border-bottom:3px solid var(--karashi);margin-bottom:30px}
  .board-inner{max-width:840px;margin:0 auto}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--asagi);text-transform:uppercase}
  .board h1{font-size:clamp(23px,5vw,32px);font-weight:800;letter-spacing:-.02em;margin:6px 0 8px}
  .board p{margin:0;color:#A9B4BF;font-size:14px;max-width:58ch}

  h2.sec{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--muted);
    text-transform:uppercase;font-weight:400;margin:34px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--rule)}

  .form{background:var(--paper-2);border:1px solid var(--rule);padding:16px 18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px}
  label.f{display:block}
  label.f > span{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
  input,select{width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:2px;
    padding:8px 10px;font-family:var(--sans);font-size:14px;color:var(--sumi)}
  input[type=time],input[type=date]{font-family:var(--mono)}
  input:focus,select:focus{outline:2px solid var(--ai-soft);outline-offset:1px}
  .wide{grid-column:1/-1}
  .sub{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin-top:-2px}

  .calc{background:var(--sumi);color:var(--paper-2);padding:16px 18px;margin-top:16px}
  .calc h4{margin:0 0 10px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--asagi);text-transform:uppercase;font-weight:400}
  .calcrow{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #2C333D;font-size:14px}
  .calcrow:last-child{border-bottom:0}
  .calcrow b{font-family:var(--mono);white-space:nowrap}
  .calcrow.hi b{color:var(--karashi)}

  .warn{border-left:3px solid var(--alert);background:#F6EDEA;padding:11px 14px;margin-top:14px;font-size:14px}
  .good{border-left:3px solid var(--ok);background:#EDF3EF;padding:11px 14px;margin-top:14px;font-size:14px}

  .line{position:relative;padding-left:36px;margin-top:20px}
  .line::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:2px;background:var(--ai-soft)}
  .day{position:relative;margin-bottom:22px;background:var(--paper-2);border:1px solid var(--rule);padding:14px 16px}
  .day::before{content:"";position:absolute;left:-35px;top:16px;width:12px;height:12px;border-radius:50%;
    background:var(--paper);border:2.5px solid var(--ai)}
  .day.onsen::before{background:var(--karashi);border-color:var(--karashi)}
  .day.move::before{background:var(--ai);border-color:var(--ai)}
  .dhead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:8px}
  .dnum{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--muted)}
  .dtitle{font-size:17px;font-weight:700;letter-spacing:-.01em}
  .dstay{margin-left:auto;font-size:12px;font-family:var(--mono);color:var(--ai);border:1px solid var(--rule);padding:2px 7px}
  ul.items{margin:0;padding-left:0;list-style:none}
  ul.items li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:4px 0;font-size:14px;align-items:baseline}
  ul.items li .tm{font-family:var(--mono);font-size:12px;color:var(--ai);white-space:nowrap}
  ul.items li .tm.dash{color:var(--muted)}
  .dnote{margin-top:9px;padding-top:9px;border-top:1px dashed var(--rule);font-size:13px;color:var(--muted)}

  .foot{margin-top:34px;padding-top:14px;border-top:1px solid var(--rule);font-size:13px;color:var(--muted)}

  .nav{display:flex;gap:0;border:1px solid var(--rule);background:var(--paper-2);margin-bottom:26px}
  .nav a{flex:1;text-align:center;padding:11px 8px;font-size:14px;font-weight:600;text-decoration:none;
    color:var(--muted);border-right:1px solid var(--rule)}
  .nav a:last-child{border-right:0}
  .nav a.on{background:var(--ai);color:var(--paper-2)}
  .nav a:hover:not(.on){color:var(--ai)}
  @media (max-width:560px){ul.items li{grid-template-columns:56px 1fr}}
</style>
</head>
<body>

<header class="board">
  <div class="board-inner">
    <div class="eyebrow">일본 11개 권역 · 비행기 시간 자동 반영</div>
    <h1>도착·출발 시각에 맞춘 일정표</h1>
    <p>지역과 비행기 시각을 넣으면 첫날 실제로 쓸 수 있는 시간과 마지막 날 거점을 떠나야 하는 시각이 계산되고, 남는 시간에 맞는 코스가 채워집니다.</p>
  </div>
</header>

<div class="wrap">
  <nav class="nav">
    <a href="index.html">① 어디로 갈까</a>
    <a href="plan.html" class="on">② 일정 짜기</a>
  </nav>

  <h2 class="sec">여행 정보</h2>
  <div class="form">
    <div class="grid">
      <label class="f wide"><span>지역</span><select id="region"></select></label>
      <label class="f"><span>출국일 (한국 → 일본)</span><input type="date" id="d1" value="2026-08-23"></label>
      <label class="f"><span>일본 도착 시각</span><input type="time" id="t1" value="15:00"></label>
      <label class="f"><span>도착 공항</span><select id="a1"></select></label>
      <label class="f"><span>귀국일</span><input type="date" id="d2" value="2026-08-28"></label>
      <label class="f"><span>일본 출발 시각</span><input type="time" id="t2" value="18:00"></label>
      <label class="f"><span>출발 공항</span><select id="a2"></select></label>
      <div class="sub">도착 공항과 출발 공항을 다르게 고르면 되돌아오지 않는 오픈조 일정이 됩니다.</div>
    </div>
    <div class="calc" id="calc"></div>
    <div id="alerts"></div>
  </div>

  <h2 class="sec">일정표</h2>
  <div class="line" id="plan"></div>

  <p class="foot">소요 시간은 평시 기준의 어림값입니다. 신칸센·재래선·버스 시각은 출발 전 실제 시각표로 다시 확인하세요. 국제선 수속은 출발 2시간 전 도착으로 계산했습니다.</p>
</div>

    {t:"기리시마",stay:"기리시마온천",cls:"onsen",items:[["09:00","특급 1시간"],["10:30","기리시마 신궁"],["13:00","화산 전망대"],["16:00","온천 료칸 체크인"]],note:"화산 활동에 따라 통제 구간이 있습니다."}],
  morning:[["09:00","덴몬칸에서 선물"],["10:00","사쓰마아게 구입"]] },

{ id:"okinawa", name:"오키나와 (나하·본섬)", base:"나하",
  airports:{ OKA:{name:"나하", nyu:45, in:{t:30,how:"유이레일 15분"}, out:45},
             ISG:{name:"이시가키", nyu:40, in:{t:180,how:"국내선 1시간 + 이동"}, out:180} },
  evening:[
    {n:"국제거리 산책과 저녁",move:8,need:90,last:22*60,note:"오키나와 소바와 아구 요리"},
    {n:"슈리성 공원",move:20,need:80,last:17*60+30,note:"복원 공사가 진행 중입니다"},
    {n:"마키시 공설시장",move:10,need:60,last:19*60,note:"산 생선을 2층에서 요리해 줍니다"}],
  days:[
    {t:"추라우미 수족관",stay:"나하",cls:"",items:[["08:30","고속버스 2시간 30분"],["11:00","고래상어 대수조"],["13:30","해양박공원 산책"],["16:00","고우리섬 다리"],["19:00","나하 복귀"]],note:"렌터카가 훨씬 편한 코스입니다."},
    {t:"남부 해안",stay:"나하",cls:"",items:[["09:30","니라이카나이 다리"],["11:00","치넨미사키 공원"],["13:00","해변 카페 점심"],["15:00","평화기념공원"],["18:00","나하 복귀"]],note:"평화기념공원은 오키나와전 역사 공간입니다."},
    {t:"이시가키·다케토미",stay:"이시가키",cls:"",items:[["08:00","국내선 1시간"],["10:30","다케토미섬 페리 15분"],["11:30","물소수레와 붉은 기와 마을"],["14:30","가비라만"],["18:00","이시가키 저녁"]],note:"본섬보다 바다가 맑습니다."},
    {t:"자마미 또는 해양 액티비티",stay:"나하",cls:"",items:[["08:00","페리 50분"],["10:00","케라마 블루 스노클링"],["14:00","해변 휴식"],["17:30","나하 복귀"]],note:"파도가 높으면 결항합니다."}],
  morning:[["09:00","국제거리에서 선물"],["10:00","베니이모타르트 구입"]] }
];

const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const toMin = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };
const fmt = m => { m=((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };
const dur = m => m>=60 ? `${Math.floor(m/60)}시간 ${m%60?m%60+'분':''}`.trim() : `${m}분`;
const dstr = s => { const d=new Date(s); return isNaN(d)?'':`${d.getMonth()+1}/${d.getDate()} (${'일월화수목금토'[d.getDay()]})`; };
const addDays = (s,n) => { const d=new Date(s); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const nightsBetween = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);

$('#region').innerHTML = REGIONS.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('');

function fillAirports(){
  const r = REGIONS.find(x=>x.id===$('#region').value);
  const opts = Object.entries(r.airports).map(([c,a])=>`<option value="${c}">${esc(a.name)}</option>`).join('');
  const keep1=$('#a1').value, keep2=$('#a2').value;
  $('#a1').innerHTML=opts; $('#a2').innerHTML=opts;
  if(r.airports[keep1]) $('#a1').value=keep1;
  if(r.airports[keep2]) $('#a2').value=keep2;
}

function build(){
  const r = REGIONS.find(x=>x.id===$('#region').value);
  const d1=$('#d1').value, d2=$('#d2').value;
  const t1=toMin($('#t1').value), t2=toMin($('#t2').value);
  const A1=r.airports[$('#a1').value], A2=r.airports[$('#a2').value];
  if(!A1||!A2) return;

  const nights = Math.max(1, Math.min(12, nightsBetween(d1,d2)));

  const baseArrive = t1 + A1.nyu + A1.in.t;
  const freeStart = baseArrive + 20;
  const freeMin = Math.max(0, (22*60+30) - freeStart);

  const airportBy = t2 - 120;
  const leaveBase = airportBy - A2.out;
  const morning = leaveBase - 9*60;

  $('#calc').innerHTML = `
    <h4>자동 계산</h4>
    <div class="calcrow"><span>입국 수속·수하물 (${esc(A1.name)})</span><b>${dur(A1.nyu)}</b></div>
    <div class="calcrow"><span>공항 → ${esc(r.base)} · ${esc(A1.in.how)}</span><b>${dur(A1.in.t)}</b></div>
    <div class="calcrow hi"><span>${esc(r.base)} 숙소 도착 예상</span><b>${fmt(baseArrive)}</b></div>
    <div class="calcrow hi"><span>첫날 쓸 수 있는 시간</span><b>${freeMin>0?dur(freeMin):'없음'}</b></div>
    <div class="calcrow"><span>귀국일 공항 도착 마감 (출발 2시간 전)</span><b>${fmt(airportBy)}</b></div>
    <div class="calcrow"><span>${esc(r.base)} → ${esc(A2.name)}</span><b>${dur(A2.out)}</b></div>
    <div class="calcrow hi"><span>${esc(r.base)}을(를) 떠나야 하는 시각</span><b>${fmt(leaveBase)}</b></div>
    <div class="calcrow"><span>전체 일정</span><b>${nights}박 ${nights+1}일</b></div>`;

  let al='';
  if(freeMin <= 30) al += `<div class="warn"><b>첫날은 이동으로 끝납니다.</b> 숙소 도착이 ${fmt(baseArrive)}이라 관광 시간이 거의 없습니다. 가볍게 저녁만 하고 쉬세요.</div>`;
  else if(freeMin >= 420) al += `<div class="good"><b>첫날 여유가 많습니다.</b> ${dur(freeMin)}을 쓸 수 있어 반나절 이상 돌아볼 수 있습니다.</div>`;
  if(leaveBase < 8*60) al += `<div class="warn"><b>마지막 날 아침이 너무 이릅니다.</b> ${esc(r.base)}을(를) ${fmt(leaveBase)}에 떠나야 합니다. 전날 저녁에 공항 근처로 미리 이동해 1박 하는 편을 권합니다.</div>`;
  else if(morning >= 150) al += `<div class="good"><b>마지막 날 오전이 넉넉합니다.</b> ${dur(morning)}가 남아 아침 일정을 하나 넣을 수 있습니다.</div>`;
  if($('#a1').value !== $('#a2').value) al += `<div class="good"><b>오픈조 일정입니다.</b> ${esc(A1.name)}으로 들어와 ${esc(A2.name)}에서 나가므로 되돌아오는 구간이 없습니다.</div>`;
  $('#alerts').innerHTML = al;

  // 첫날 저녁 코스
  const picks=[]; let cur=freeStart, budget=freeMin;
  if(freeMin > 30){
    for(const x of [...r.evening].sort((a,b)=>b.need-a.need)){
      const cost = x.move + x.need;
      if(cost <= budget && cur <= x.last && picks.length < 3){
        picks.push({...x, at: cur + x.move}); cur += cost; budget -= cost;
      }
    }
  }

  const li = (t,x) => `<li><span class="tm${t?'':' dash'}">${t||'—'}</span><span>${x}</span></li>`;
  const days = [];

  days.push({cls:'move', d:dstr(d1), n:'DAY 01', t:`${r.base} 도착`, stay:r.base,
    items:[
      li(fmt(t1), `${esc(A1.name)} 도착 · 입국 수속과 수하물`),
      li(fmt(t1+A1.nyu), `공항 출발 · ${esc(A1.in.how)}`),
      li(fmt(baseArrive), `${esc(r.base)} 숙소 도착 · 체크인`),
      ...(picks.length ? picks.map(p=>li(fmt(p.at), `${esc(p.n)} <span style="color:var(--muted)">— ${esc(p.note)}</span>`))
                       : [li('', '무리하지 말고 숙소 근처에서 저녁만 해결')])
    ],
    note:'철도 패스를 쓴다면 오늘은 개시하지 않고 둘째 날부터 여는 편이 유리할 때가 많습니다.'});

  const mid = nights - 1;
  for(let i=0;i<mid;i++){
    const m = r.days[i % r.days.length];
    const extra = i >= r.days.length ? ' (반복 · 다른 곳으로 바꿔도 됩니다)' : '';
    days.push({cls:m.cls, d:dstr(addDays(d1,i+1)), n:'DAY '+String(i+2).padStart(2,'0'),
      t:m.t+extra, stay:m.stay, items:m.items.map(([a,b])=>li(a,esc(b))), note:m.note});
  }

  const last=[];
  if(morning >= 150) r.morning.forEach(([a,b])=>last.push(li(a,esc(b))));
  else if(morning > 30) last.push(li('', '시간이 빠듯하니 역이나 공항에서 선물만 사세요'));
  else last.push(li('', '곧바로 공항으로 출발하세요'));
  last.push(li(fmt(leaveBase), `${esc(r.base)} 출발 · ${esc(A2.name)}까지 ${dur(A2.out)}`));
  last.push(li(fmt(airportBy), '공항 도착 · 수속'));
  last.push(li(fmt(t2), '한국으로 출발'));

  days.push({cls:'move', d:dstr(d2), n:'DAY '+String(nights+1).padStart(2,'0'), t:'귀국', stay:'—',
    items:last, note:'공항 연결 열차나 버스가 패스 구간인지 미리 확인하세요.'});

  $('#plan').innerHTML = days.map(x=>`
    <article class="day ${x.cls}">
      <div class="dhead">
        <span class="dnum">${x.n} · ${x.d}</span>
        <span class="dtitle">${esc(x.t)}</span>
        <span class="dstay">${esc(x.stay)}</span>
      </div>
      <ul class="items">${x.items.join('')}</ul>
      <div class="dnote">${esc(x.note)}</div>
    </article>`).join('');
}

$('#region').addEventListener('change', ()=>{ fillAirports(); build(); });
['d1','t1','a1','d2','t2','a2'].forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener('input', build); el.addEventListener('change', build);
});
fillAirports(); build();
</script>
</body>
</html>
